# Reverse-proxy DAT POKER API through Apache (Path B in docs/AWS_EC2.md).
# Install: sudo cp httpd-dat-poker.conf /etc/httpd/conf.d/dat-poker-proxy.conf && sudo systemctl restart httpd
ProxyPass /health http://127.0.0.1:4000/health
ProxyPassReverse /health http://127.0.0.1:4000/health
ProxyPass /v1/ http://127.0.0.1:4000/v1/
ProxyPassReverse /v1/ http://127.0.0.1:4000/v1/
